name: Playwright Tests with Allure & Email

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Menerima sinyal trigger dari repo aplikasi demo
  repository_dispatch:
    types: [run-automation]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    # 0. Ambil History dari branch gh-pages di awal agar workspace bersih
    - name: Get Allure History
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: allure-history-temp
        
    # 1. Mengklon repo aplikasi demo (`ecommerce-demo`) ke dalam runner automation
    - name: Checkout Demo App
      uses: actions/checkout@v4
      with:
        repository: ilmanarif/ecommerce-demo
        path: demo-app

    # 2. Install dependencies aplikasi demo dan jalankan di background
    - name: Start Local Demo App
      run: |
        cd demo-app
        npm ci
        # Jalankan server aplikasi di background
        npm run start &
        
    # 3. Menunggu beberapa detik atau memastikan port 3000 siap diakses
    - name: Wait for App to be Ready
      run: npx wait-on http://localhost:3000/

    # 4. Install dependencies untuk repo automation Playwright
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    # 5. Jalankan tes Playwright
    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true

    # 6. Pulihkan dan gabungkan riwayat lama ke allure-results yang baru
    - name: Restore Previous Allure History
      if: always()
      run: |
        if [ -d "allure-history-temp/history" ]; then
          mkdir -p allure-results/history
          cp -r allure-history-temp/history/* allure-results/history/
          echo "History successfully restored!"
        else
          echo "No previous history found, starting fresh."
        fi
      
    # 7. Pastikan Allure CLI terinstal secara lokal/global di runner
    - name: Install Allure Commandline
      if: always()
      run: npm install -g allure-commandline

    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report

    # 8. Mengunggah halaman Allure ke GitHub Pages
    - name: Upload page artifact
      uses: actions/upload-pages-artifact@v3
      if: always()
      with:
        path: allure-report

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      if: always()

    - name: Upload Playwright/Allure Artifacts
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-reports
        path: |
          playwright-report/
          allure-report/
        retention-days: 30

    # 9. Kirim email notifikasi hasil pengujian
    - name: Send email notification
      uses: dawidd6/action-send-mail@v3
      if: always()
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "CI/CD Test Report - Status: ${{ job.status }}"
        to: ilman.arif29@gmail.com
        from: Automation CI/CD <no-reply@github.com>
        body: |
          Halo,
          
          Pengujian otomatisasi regresi (Playwright) telah selesai dijalankan di server.
          Status Pipeline: ${{ job.status }}
          
          Anda dapat melihat laporan lengkap Allure secara interaktif melalui tautan berikut:
          👉 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          
          Silakan cek repositori GitHub untuk mengunduh artifact laporan lengkap jika diperlukan.