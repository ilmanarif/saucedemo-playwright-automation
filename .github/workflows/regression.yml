name: Playwright Tests with Allure & Email

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true
      
    # Ganti simple-elf/allure-action dengan instalasi Allure CLI manual
    - name: Install Allure Commandline
      if: always()
      run: npm install -g allure-commandline --save-dev

    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report

    - name: Upload Playwright/Allure Artifacts
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-reports
        path: |
          playwright-report/
          allure-report/
        retention-days: 30

    - name: Send email notification
      uses: dawidd6/action-send-mail@v3
      if: always()
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "CI/CD Test Report - Status: ${{ job.status }}"
        to: email-penerima@example.com
        from: Automation CI/CD <no-reply@github.com>
        body: |
          Halo,
          
          Pengujian otomatisasi regresi (Playwright) telah selesai dijalankan di server.
          Status Pipeline: ${{ job.status }}
          
          Silakan cek repositori GitHub untuk melihat detail log dan mengunduh artifact laporan lengkap.